inputs:
  benchmark:
    description: "Which benchmark to run. 'terminal-bench-2-1' (TB2.1, default), 'terminal-bench-2' (original TB2), 'swe-bench-pro', or 'deep-swe'."
    type: string
    default: "terminal-bench-2-1"
    options:
      - "terminal-bench-2"
      - "terminal-bench-2-1"
      - "swe-bench-pro"
      - "deep-swe"
  agent:
    description: "Benchmark agent to run. 'kimchi-workflow' and 'pi-workflow' both run a named workflow through the kimchi-workflows extension — the first hosted by the kimchi binary built from target_ref, the second by stock pi, which isolates the workflow from kimchi's extension layer. 'claude-code-standard' uses the stock Claude Code release against the native Anthropic API (no Kimchi gateway)."
    type: string
    default: kimchi
    options:
      - kimchi
      - opencode
      - claude-code
      - claude-code-standard
      - cursor
      - pi
      - kimchi-workflow
      - pi-workflow
  workflow:
    description: "Declared workflow name to run (not a filename). 'ferment-oneshot' runs under kimchi-workflow; 'deep-solve' needs the wall-clock deadline only pi-workflow supplies. Ignored unless agent is kimchi-workflow or pi-workflow."
    type: string
    default: "ferment-oneshot"
  workflow_extension:
    description: "kimchi-workflows extension spec: 'npm:<pkg>@<version-or-dist-tag>' or 'dir:<host path>'. Defaults to the 'latest' tag so runs pick up new publishes; each result.json records the version that resolved. Give a version or tag explicitly — a bare package name resolves through the '*' range, which excludes the prereleases this engine publishes. Ignored unless agent is kimchi-workflow or pi-workflow."
    type: string
    default: "npm:@kimchi-dev/kimchi-workflows@latest"
  target_ref:
    description: "Git ref to fetch from origin and benchmark. Defaults to master."
    type: string
    default: "master"
  benchmark_tag:
    description: "Optional tag identifying the schedule/source of this run (e.g. 'daily-tb2')."
    type: string
    default: ""
  tasks_all:
    description: "Run every task in the dataset, ignoring the `tasks` selection. Use for full benchmark runs."
    type: boolean
    default: false
  tasks:
    description: "Benchmark tasks to run, as bare task names (e.g. fix-git). Harbor's own output prints the source-qualified form (terminal-bench/fix-git); pasting that is accepted and normalised. Names are validated against the dataset when the pipeline starts, so a typo fails immediately instead of after retrying. Defaults to a Terminal Bench 2 subset chosen as the most informative tasks (explaining ~96% of variance in total score). Ignored when `tasks_all` is true. For SWE-bench Pro, pass instance IDs from datasets/swebenchpro.json."
    type: array
    default: [hf-model-inference, fix-code-vulnerability, build-cython-ext, bn-fit-modify, fix-git, mteb-leaderboard, cobol-modernization, merge-diff-arc-agi-task, extract-elf, pytorch-model-recovery]
  model:
    description: "Model or execution mode. kimchi-dev/* routes via the Kimchi gateway; openrouter/* routes via OpenRouter (kimchi, pi, workflow, claude-code, and opencode agents); zai/* routes directly via Z.AI's API using ZAI_API_KEY (same agents as openrouter); anthropic/* uses the native Anthropic API (works with kimchi and claude-code-standard agents); moonshotai/* uses the native Moonshot AI API (kimchi, pi, workflow, claude-code, and opencode agents) and requires the MOONSHOT_API_KEY CI/CD variable. Select multi-model to use the target ref's default role configuration."
    type: string
    default: "kimchi-dev/minimax-m3"
    options:
      - multi-model
      - kimchi-dev/kimi-k2.7
      - kimchi-dev/kimi-k3
      - kimchi-dev/claude-sonnet-4-6
      - kimchi-dev/claude-sonnet-5
      - kimchi-dev/claude-opus-4-6
      - kimchi-dev/claude-opus-4-8
      - kimchi-dev/claude-fable-5
      - kimchi-dev/minimax-m3
      - kimchi-dev/glm-5.2-fp8
      - kimchi-dev/deepseek-v4-flash
      # Native Moonshot API (require MOONSHOT_API_KEY, not KIMCHI_API_KEY)
      - moonshotai/kimi-k2.7-code
      - moonshotai/kimi-k3
      # Preset-pinned: route only to Moonshot (int4) instead of load-balancing across
      # multiple providers. Use this for recorded scores with Kimi K2.7.
      - openrouter/@preset/kimi-k2-7-moonshot
      # Preset-pinned: route only to Z.AI (fp8) instead of load-balancing across
      # ~20 endpoints of differing quantization. Use these for recorded scores.
      - openrouter/@preset/glm-5-1-zai
      - openrouter/@preset/glm-5-2-zai
      # Direct Z.AI fp8 endpoint (no OpenRouter, no preset needed). Requires
      # ZAI_API_KEY. Only high/max thinking levels are accepted.
      - zai/glm-5.2
      # Native Anthropic API (claude-code-standard only)
      - anthropic/claude-sonnet-5
      - anthropic/claude-opus-4-8
      # Cursor-hosted models (require CURSOR_API_KEY, not KIMCHI_API_KEY)
      - cursor/composer-2.5
      - cursor/glm-5.2
      - cursor/kimi-k2.7-code
  kimchi_ferment_oneshot:
    description: "Run each task through Kimchi ferment one-shot workflow. Ignored unless agent is kimchi."
    type: boolean
    default: false
  kimchi_goal:
    description: "Run each task as a persistent Kimchi Goal. Ignored unless agent is kimchi."
    type: boolean
    default: false
  kimchi_compaction:
    description: "Kimchi auto-compaction. 'auto' (default) disables it for ferment one-shot runs and keeps it on otherwise; 'enabled'/'disabled' force it. Ignored unless agent is kimchi."
    type: string
    default: "auto"
    options:
      - "auto"
      - "enabled"
      - "disabled"
  retry_agent_timeout:
    description: "Retry chunks whose agent runs hit an AgentTimeoutError verdict. Infra errors are always retried."
    type: boolean
    default: false
  trial_checkpoints:
    description: "Upload per-trial GCS checkpoints as trials finish and restore them at chunk startup, so a killed chunk loses no completed trial. Requires the BENCH_CHECKPOINT_BUCKET project CI/CD variable to be set when true. Not supported for swe-bench-pro yet (forced off there regardless of this input)."
    type: boolean
    default: true

  analyze_results:
    description: "Generate and upload session analysis after the benchmark summary."
    type: boolean
    default: false
  parallelism:
    description: "Maximum number of benchmark tasks to run concurrently."
    type: number
    default: 8
  attempts:
    description: "Attempts per selected task."
    type: number
    default: 1
  timeout_multiplier:
    description: "Scales each task timeout. Use 1 for the benchmark default."
    type: number
    default: 1
  temperature:
    description: "LLM sampling temperature applied to every call (0.0–1.0). Leave unset (0) to use the model default."
    type: number
    default: 0
  top_p:
    description: "LLM nucleus sampling top_p applied to every call (0.0–1.0). Leave unset (0) to use the model default."
    type: number
    default: 0
  top_k:
    description: "LLM top-k sampling applied to every call (positive int). Leave unset (0) to use the model default."
    type: number
    default: 0
  max_tokens:
    description: "Maximum output tokens per LLM call (positive int). Leave unset (0) to use the model default."
    type: number
    default: 0
  thinking_level:
    description: "Thinking/reasoning level. 'default' uses the harness's dynamic thinking levels; a fixed level overrides it for every call. kimchi/pi agents accept every level; claude-code maps the level to Claude Code's --effort and rejects off/minimal (no equivalent); opencode ignores it. Note that a level only reaches the model if the model itself supports a reasoning-effort parameter."
    type: string
    default: "default"
    options:
      - "default"
      - "off"
      - "minimal"
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
