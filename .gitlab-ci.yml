spec:
  include:
    - local: /.gitlab/ci/terminal-bench-2.inputs.yml
---

include:
  - local: /.gitlab/ci/terminal-bench-2.yml
    inputs:
      dataset_version: $[[ inputs.dataset_version ]]
      agent: $[[ inputs.agent ]]
      target_ref: $[[ inputs.target_ref ]]
      tasks: $[[ inputs.tasks ]]
      model: $[[ inputs.model ]]
      kimchi_multi_model: $[[ inputs.kimchi_multi_model ]]
      kimchi_ferment_oneshot: $[[ inputs.kimchi_ferment_oneshot ]]
      analyze_results: $[[ inputs.analyze_results ]]
      tasks_all: $[[ inputs.tasks_all ]]
      retry_agent_timeout: $[[ inputs.retry_agent_timeout ]]
      parallelism: $[[ inputs.parallelism ]]
      attempts: $[[ inputs.attempts ]]
      timeout_multiplier: $[[ inputs.timeout_multiplier ]]
      temperature: $[[ inputs.temperature ]]
      top_p: $[[ inputs.top_p ]]
      top_k: $[[ inputs.top_k ]]
      max_tokens: $[[ inputs.max_tokens ]]
