spec:
  include:
    - local: /.gitlab/ci/benchmark.inputs.yml
---

stages:
  - prepare
  - benchmark
  - postprocess
  - notify
  - summarize
  - maintenance

workflow:
  name: '$PIPELINE_NAME'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PIPELINE_NAME: 'Benchmarks Tests — MR !$CI_MERGE_REQUEST_IID'
    - if: '$TB21_RETRY_TRIGGER == "true" || $TB21_RETRY_SCHEDULE == "true"'
      variables:
        PIPELINE_NAME: 'TB2.1 Failed Pipeline Retry'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        PIPELINE_NAME: '$[[ inputs.benchmark ]] — $[[ inputs.agent ]] · $[[ inputs.model ]] · $[[ inputs.target_ref ]] · ferment=$[[ inputs.kimchi_ferment_oneshot ]] · tasks_all=$[[ inputs.tasks_all ]]'
        BENCHMARK_RESOURCE_GROUP: $[[ inputs.benchmark ]]-$[[ inputs.agent ]]-scheduled
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      variables:
        PIPELINE_NAME: '$[[ inputs.benchmark ]] — $[[ inputs.agent ]] · $[[ inputs.model ]] · $[[ inputs.target_ref ]] · ferment=$[[ inputs.kimchi_ferment_oneshot ]] · tasks_all=$[[ inputs.tasks_all ]]'
        BENCHMARK_RESOURCE_GROUP: '$[[ inputs.benchmark ]]-$[[ inputs.agent ]]-$[[ inputs.target_ref ]]'
    - when: never

include:
  - local: /.gitlab/ci/tb21-failed-pipeline-retry.yml
  - local: /.gitlab/ci/terminal-bench-2.yml
    rules:
      - if: '("$[[ inputs.benchmark ]]" == "terminal-bench-2" || "$[[ inputs.benchmark ]]" == "terminal-bench-2-1") && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    inputs:
      benchmark: $[[ inputs.benchmark ]]
      agent: $[[ inputs.agent ]]
      target_ref: $[[ inputs.target_ref ]]
      benchmark_tag: $[[ inputs.benchmark_tag ]]
      tasks: $[[ inputs.tasks ]]
      model: $[[ inputs.model ]]
      kimchi_ferment_oneshot: $[[ inputs.kimchi_ferment_oneshot ]]
      kimchi_compaction: $[[ inputs.kimchi_compaction ]]
      analyze_results: $[[ inputs.analyze_results ]]
      tasks_all: $[[ inputs.tasks_all ]]
      retry_agent_timeout: $[[ inputs.retry_agent_timeout ]]
      parallelism: $[[ inputs.parallelism ]]
      attempts: $[[ inputs.attempts ]]
      timeout_multiplier: $[[ inputs.timeout_multiplier ]]
      temperature: $[[ inputs.temperature ]]
      top_p: $[[ inputs.top_p ]]
      top_k: $[[ inputs.top_k ]]
      max_tokens: $[[ inputs.max_tokens ]]
  - local: /.gitlab/ci/swe-bench-pro.yml
    rules:
      - if: '"$[[ inputs.benchmark ]]" == "swe-bench-pro" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    inputs:
      agent: $[[ inputs.agent ]]
      target_ref: $[[ inputs.target_ref ]]
      benchmark_tag: $[[ inputs.benchmark_tag ]]
      tasks: $[[ inputs.tasks ]]
      tasks_all: $[[ inputs.tasks_all ]]
      model: $[[ inputs.model ]]
      kimchi_ferment_oneshot: $[[ inputs.kimchi_ferment_oneshot ]]
      kimchi_compaction: $[[ inputs.kimchi_compaction ]]
      analyze_results: $[[ inputs.analyze_results ]]
      retry_agent_timeout: $[[ inputs.retry_agent_timeout ]]
      parallelism: $[[ inputs.parallelism ]]
      attempts: $[[ inputs.attempts ]]
      timeout_multiplier: $[[ inputs.timeout_multiplier ]]
      temperature: $[[ inputs.temperature ]]
      top_p: $[[ inputs.top_p ]]
      top_k: $[[ inputs.top_k ]]
      max_tokens: $[[ inputs.max_tokens ]]

benchmarks-tests:
  stage: prepare
  image: ghcr.io/astral-sh/uv:python3.14-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "benchmarks"'
  script:
    - cd benchmark/scripts/gitlab
    - uv run ruff check .
    - uv run pytest
    - cd ../../terminal-bench-2
    - uv run ruff check .
    - uv run pytest
