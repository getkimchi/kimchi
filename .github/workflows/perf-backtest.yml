# TEMPORARY — pre-merge noise validation for the perf gate. Replays the gate
# against sampled master commits ("innocent" code that merged) to look for
# false positives. Runs only on pushes to this PR that touch the two
# backtest files; removed before merge.
name: Perf gate backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/perf-backtest.yml'
      - 'backtest-shas.txt'

permissions:
  contents: read

concurrency:
  group: perf-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shas:
    runs-on: ubuntu-24.04-arm
    outputs:
      list: ${{ steps.split.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        # One entry per line: "SHA [LABEL]". The optional label names the
        # artifact, so the same SHA can appear several times (repeat jobs).
        run: |
          LIST=$(grep -v '^#' backtest-shas.txt | grep -v '^$' \
            | jq -R 'split(" ") | map(select(. != "")) | {sha: .[0], label: (.[1] // .[0])}' | jq -cs .)
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  backtest:
    needs: shas
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.shas.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.entry.sha }}
          fetch-depth: 0

      - name: Overlay the gate harness from the PR head
        # Only tools/perf (harness + budgets) comes from the PR head; the
        # measured tree keeps its own package.json/lockfile/patches/proxy
        # helper, so old code builds against its own dependencies — exactly
        # what a PR diff touching nothing else would have compiled like.
        env:
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --depth=1 origin "$GATE_SHA"
          git checkout FETCH_HEAD -- tools/perf
          git status --short | head -20

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build proxy-helper
        run: make copy-for-dev
        working-directory: tools/proxy-helper

      - name: Enable hardware counters
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=0
          cat /proc/sys/kernel/perf_event_paranoid

      - name: Build binary
        run: pnpm run build:binary

      - name: Run perf gate
        # Direct python3 calls: old trees have no perf:* package scripts.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          python3 tools/perf/gate.py --selfcheck
          python3 tools/perf/gate.py --binary dist/bin/kimchi --out "$RUNNER_TEMP/perf-gate-runs" --expect-version "$VERSION"

      - name: Advisory lanes (healthy/fresh idle, large tool outputs store on vs off)
        # Runs even when the gate step fails: old binaries miss today's budgets,
        # and those are exactly the baselines these lanes need.
        if: always()
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for sc in idle_healthy idle_fresh bigtools bigtools_off; do
            python3 tools/perf/scenarios.py --binary dist/bin/kimchi --scenario "$sc" --reps 2 --idle 90 \
              --out "$RUNNER_TEMP/perf-gate-runs/$sc.jsonl" --expect-version "$VERSION" || echo "$sc failed"
          done

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.entry.label }}
          path: ${{ runner.temp }}/perf-gate-runs/*.jsonl
          if-no-files-found: ignore

  # One-shot debugging lane: JS-level CPU profile of the idle scenario on the
  # culprit commit (bd659df9d) vs its parent, to pin down which stacks burn
  # the post-#1482 idle instructions. Runs the app in dev mode (bun
  # --cpu-prof src/entry.ts) so the profile carries JS frames; the gate
  # binary profile would need symbols Bun does not embed.
  profile:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: 1219aa4382b267cf407484e3e64fb0a320b39113
            tag: parent
          - sha: bd659df9dc84df5cdd27184df048086d2ab649a7
            tag: culprit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Overlay the gate harness from the PR head
        env:
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --depth=1 origin "$GATE_SHA"
          git checkout FETCH_HEAD -- tools/perf

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build proxy-helper
        run: make copy-for-dev
        working-directory: tools/proxy-helper

      - name: Dev-mode profiling wrapper
        run: |
          BUNBIN="$(command -v bun)"
          cat > "$RUNNER_TEMP/prof-wrap.sh" <<EOF
          #!/bin/sh
          exec "$BUNBIN" --preload "$PWD/src/set-package-dir.ts" \
            --cpu-prof --cpu-prof-dir="$RUNNER_TEMP" --cpu-prof-name=profile.cpuprofile \
            "$PWD/src/entry.ts" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/prof-wrap.sh"
          "$RUNNER_TEMP/prof-wrap.sh" --version

      - name: Run profiled idle scenario
        run: python3 tools/perf/scenarios.py --binary "$RUNNER_TEMP/prof-wrap.sh" --scenario idle --idle 60 --out "$RUNNER_TEMP/profile.jsonl"

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/profile.cpuprofile
            ${{ runner.temp }}/profile.jsonl
          if-no-files-found: ignore

  # Second debugging lane: syscall-level file activity of the REAL binary on
  # parent vs culprit (the dev-mode cpuprofile showed identical main-thread
  # cost, so the regression sits in native/child work). strace -yy resolves
  # read fds back to paths; we aggregate bytes/read-per-path offline.
  trace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: 1219aa4382b267cf407484e3e64fb0a320b39113
            tag: parent
          - sha: bd659df9dc84df5cdd27184df048086d2ab649a7
            tag: culprit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0

      - name: Overlay the gate harness from the PR head
        env:
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --depth=1 origin "$GATE_SHA"
          git checkout FETCH_HEAD -- tools/perf

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build proxy-helper
        run: make copy-for-dev
        working-directory: tools/proxy-helper

      - name: Build binary
        run: pnpm run build:binary

      - name: Install strace and wrap the binary
        run: |
          sudo apt-get install -y strace >/dev/null 2>&1 || sudo apt-get update >/dev/null && sudo apt-get install -y strace | tail -1
          cat > "$RUNNER_TEMP/trace-wrap.sh" <<EOF
          #!/bin/sh
          exec strace -f -qq -e trace=openat,openat2,read,close -yy -t \
            -o "$RUNNER_TEMP/strace.$$.log" "$PWD/dist/bin/kimchi" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/trace-wrap.sh"

      - name: Run traced idle scenario
        run: python3 tools/perf/scenarios.py --binary "$RUNNER_TEMP/trace-wrap.sh" --scenario idle --idle 60 --out "$RUNNER_TEMP/trace.jsonl"

      - name: Upload strace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/strace.*.log
            ${{ runner.temp }}/trace.jsonl
          if-no-files-found: ignore
