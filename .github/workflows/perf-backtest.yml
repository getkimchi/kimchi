# Raw session sampling and the release-series backtest, dispatched on demand.
name: Perf gate backtest

on:
  workflow_dispatch:
    inputs:
      entries:
        description: "Lines: SHA [LABEL] — the trees to measure"
        required: true
      reps:
        description: "Reps per scenario or sampled session"
        default: "2"
        required: false
      calibrate:
        description: "Rewrite budgets.json from a fully green backtest (not a sample run)"
        default: "false"
        required: false

permissions:
  contents: read

concurrency:
  group: perf-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shas:
    runs-on: ubuntu-24.04-arm
    outputs:
      list: ${{ steps.split.outputs.list }}
    steps:
      - id: split
        env:
          ENTRIES: ${{ inputs.entries }}
        run: |
          LIST=$(printf '%s\n' "$ENTRIES" | grep -v '^#' | grep -v '^$' \
            | jq -R 'split(" ") | map(select(. != "")) | {sha: .[0], label: (.[1] // .[0])}' | jq -cs .)
          if [ "$LIST" = "[]" ]; then
            echo "no entries: pass lines of 'SHA [LABEL]' in the entries input" >&2
            exit 1
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  backtest:
    needs: shas
    runs-on: ubuntu-24.04-arm
    # Two full heavy-install reps generate and reconcile 1M work records
    # plus 600k outbox events, in addition to the other gate lanes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.shas.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.entry.sha }}
          fetch-depth: 0

      - name: Overlay the measurement harness from the selected workflow ref
        env:
          SAMPLE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --depth=1 origin "$SAMPLE_SHA"
          git checkout FETCH_HEAD -- tools/perf
          git status --short | head -40

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build proxy-helper
        run: make copy-for-dev
        working-directory: tools/proxy-helper

      - name: Enable hardware counters
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=0
          cat /proc/sys/kernel/perf_event_paranoid

      - name: Build binary
        run: pnpm run build:binary

      - name: Run perf gate
        env:
          # Dispatch inputs never interpolate into the run shell: an expansion inside a run block
          # is expanded by GitHub before bash parses it, so a crafted value breaks out of argv.
          REPS: ${{ inputs.reps }}
          CALIBRATE: ${{ inputs.calibrate }}
          KIMCHI_PERF_SOURCE_SHA: ${{ matrix.entry.sha }}
          KIMCHI_PERF_HARNESS_SHA: ${{ github.sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          python3 tools/perf/gate.py --selfcheck
          python3 tools/perf/gate.py --binary dist/bin/kimchi --out "$RUNNER_TEMP/perf-gate-runs" --expect-version "$VERSION" --reps "${REPS:-2}" ${{ env.CALIBRATE == 'true' && '--calibrate' || '' }}

      - name: Advisory lanes
        if: always()
        env:
          ADVISORY_REPS: ${{ inputs.reps }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for sc in idle_healthy idle_fresh bigtools bigtools_off; do
            python3 tools/perf/scenarios.py --binary dist/bin/kimchi --scenario "$sc" --reps "${ADVISORY_REPS:-2}" --idle 90 \
              --out "$RUNNER_TEMP/perf-gate-runs/$sc.jsonl" --expect-version "$VERSION" || echo "$sc failed"
          done

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.entry.label }}
          path: ${{ runner.temp }}/perf-gate-runs/*.jsonl
          if-no-files-found: ignore

      - name: Upload calibrated budgets
        if: inputs.calibrate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: budgets-${{ matrix.entry.label }}
          path: tools/perf/budgets.json
          if-no-files-found: ignore
