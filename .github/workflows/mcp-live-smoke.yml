name: MCP live smoke

# Live OAuth provider check: proves the authorize request the built binary
# constructs is still accepted by real providers (redirect-URI class,
# Google-style offline-access parameters, provider answers with a sign-in
# page rather than an OAuth error).
#
# The provider inventory comes from the MCP_LIVE_PROVIDERS secret, so this
# job degrades deliberately where its inputs are unavailable or untrusted:
#   - fork pull requests see no secrets — the live step is skipped (the
#     script itself would exit 0; skipping saves the build too);
#   - the `skip-live-mcp` label skips the check during provider outages;
#   - same-repository branch pull requests DO run with the secret: these
#     come from collaborators, the standard GitHub CI trust boundary. For a
#     stricter posture, move the live step into a protected environment.
# Assertions are limited to deterministic OAuth error contracts, and every
# entry retries once on network errors and 5xx responses.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: 'true'

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod
          cache-dependency-path: tools/proxy-helper/go.sum

      - name: Build proxy-helper
        run: make -C tools/proxy-helper build

      - name: Pure checks self-test
        run: node scripts/mcp-live-probe.mjs --self-test

      # Same-repository pull requests only (collaborator trust boundary);
      # scheduled and dispatched runs always pass the gate.
      - name: Build binary
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-live-mcp') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: pnpm run build:binary

      - name: Run live provider check
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-live-mcp') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          MCP_LIVE_PROVIDERS: ${{ secrets.MCP_LIVE_PROVIDERS }}
        run: node scripts/mcp-live-probe.mjs

      - name: Upload probe matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-live-probe-matrix-${{ github.run_attempt }}
          path: mcp-live-probe-matrix.json
          if-no-files-found: ignore
          retention-days: 14
