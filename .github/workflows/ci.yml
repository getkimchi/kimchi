name: CI

# No push trigger: the merge queue (squash, master-checks green, no bypass)
# has already tested the exact tree that lands on master.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

# github.ref is unique per PR (refs/pull/N/merge) and per merge queue entry,
# so a new push cancels only its own stale run. github.head_ref is not used
# because two fork PRs can share a branch name.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Playwright 1.59.1 cannot install Chromium on Ubuntu 26.04, so the Linux
# jobs pin ubuntu-24.04. Remove the pins when upgrading to Playwright 1.61+.
jobs:
  # Decides which path-filtered suites this change needs. The rules live in
  # scripts/ci/changes.js. Only pull requests are filtered.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tui: ${{ steps.decide.outputs.tui }}
      acp: ${{ steps.decide.outputs.acp }}
      mcp: ${{ steps.decide.outputs.mcp }}
    steps:
      # Depth 2 gives the PR merge commit and its first parent, the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/ci/changes.js HEAD^1 HEAD
          else
            node scripts/ci/changes.js --all
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Check (lint + type check)
        run: pnpm run check

      # The pinned library and bundled release must identify the same bridge commit.
      - name: Bridge library pin
        run: pnpm run check:bridge-pin

  unit:
    uses: ./.github/workflows/_test-suite.yml
    with:
      name: unit
      shards: "[1, 2, 3, 4]"
      search-tools: true
      playwright: true
      command: pnpm run test --shard="$SHARD_INDEX/$SHARD_TOTAL"

  # Builds the binary and proxy-helper once. Every suite that runs the binary
  # downloads this artifact, so it is not rebuilt per suite.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          go: "true"

      - name: Build proxy-helper
        run: make copy-for-dev # Builds it and copies it to bin/, where kimchi finds it
        working-directory: tools/proxy-helper

      - name: Test proxy-helper
        run: make test
        working-directory: tools/proxy-helper

      # The lint job typechecks the same tree.
      - name: Build binary
        run: pnpm run build:binary
        env:
          KIMCHI_SKIP_TYPECHECK: "1"

      # Kept for 3 days so "Re-run failed jobs" still works the next day.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-build
          path: |
            dist/**
            bin/proxy-helper
          retention-days: 3
          compression-level: 1

  # Script tests take a few seconds, so they run here instead of in their own job.
  smoke:
    needs: build
    uses: ./.github/workflows/_test-suite.yml
    with:
      name: smoke
      use-build: true
      search-tools: true
      playwright: true
      command: |
        pnpm run test:scripts
        node --import tsx --input-type=module -e "import pty from 'node-pty'; if (typeof pty.spawn !== 'function') throw new Error('node-pty spawn is unavailable')"
        pnpm run test:smoke

  # Advisory: the gate does not wait for it. PR and manual runs only.
  tui-e2e:
    needs: [changes, build]
    if: github.event_name != 'merge_group' && needs.changes.outputs.tui == 'true'
    uses: ./.github/workflows/_test-suite.yml
    with:
      name: tui-e2e
      # Shards are balanced by tests/e2e/tui/timings.json to about 7 minutes each.
      shards: "[1, 2, 3, 4, 5, 6]"
      timeout-minutes: 15
      use-build: true
      search-tools: true
      bubblewrap: true
      # The timings file feeds pnpm run test:e2e:tui:timings (docs/ci.md).
      command: KIMCHI_TUI_TIMINGS_OUT="$PWD/tui-e2e-timings.json" pnpm run test:e2e:tui:ci --shard "$SHARD_INDEX/$SHARD_TOTAL"
      report-artifacts: tui-e2e-timings.json
      failure-artifacts: |
        *.tui-e2e.log
        **/tui-traces/**

  # Advisory: the gate does not wait for it. It also runs in the merge queue,
  # where PR-time runs miss combinations created when master moves on. A
  # failure there blocks nothing and shows only in the Actions tab.
  acp-e2e:
    needs: [changes, build]
    if: needs.changes.outputs.acp == 'true'
    uses: ./.github/workflows/_test-suite.yml
    with:
      name: acp-e2e
      timeout-minutes: 15
      use-build: true
      search-tools: true
      command: pnpm run test:e2e:acp:ci
      failure-artifacts: |
        *.acp-e2e.log
        **/acp-traces/**

  # MCP protocol conformance. The MCP TUI and ACP files run in tui-e2e and
  # acp-e2e. Advisory. PR and manual runs only.
  mcp-conformance:
    needs: [changes, build]
    if: github.event_name != 'merge_group' && needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/_test-suite.yml
    with:
      name: mcp-conformance
      use-build: true
      command: pnpm run test:e2e:mcp:conformance:ci
      failure-artifacts: .kimchi/mcp-conformance-results/**

  # Tripwire for ACP wire-compat regressions (docs/acp-compat.md). It diffs
  # against the PR base, so it runs on pull requests only. It is advisory: the
  # gate below does not wait for it.
  acp-wire-tripwire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      # Self-test first so a broken checker fails as a checker bug, not as a
      # wire finding.
      - name: ACP wire-compat tripwire
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          pnpm run check:acp-wire:self-test
          pnpm run check:acp-wire -- --base "origin/${{ github.base_ref }}"

  # Document unit tests on macOS and Windows: the documents modules must behave
  # the same on every target. Linux is covered by the unit job. Advisory.
  documents-cross-os:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Document unit tests
        run: pnpm exec vitest run src/extensions/documents

  # The only required check. The "Master" ruleset requires the context
  # "master-checks", so the job keeps that name. Add a job to `needs` to make
  # it block merges; shards and new jobs then never touch branch protection.
  #
  # `if: always()` is required: without it a failed need makes this job
  # "skipped", and GitHub treats a skipped required check as passing.
  # `!cancelled()` is not enough either: a cancelled merge queue run would
  # skip the gate the same way.
  master-checks:
    if: always()
    needs: [lint, unit, build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
