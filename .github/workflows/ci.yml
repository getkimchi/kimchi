name: CI

# No push trigger: the merge queue (squash, all checks green, no bypass) has
# already tested the exact tree that lands on master.
on:
  pull_request:
  merge_group:

# github.ref is unique per PR (refs/pull/N/merge) and per merge queue entry,
# so a new push cancels only its own stale run. github.head_ref is not used
# because two fork PRs can share a branch name.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Playwright 1.59.1 cannot install Chromium on Ubuntu 26.04, so the Linux
# jobs pin ubuntu-24.04. Remove the pins when upgrading to Playwright 1.61+.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Check (lint + type check)
        run: pnpm run check

  unit:
    name: unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Run every shard even when one fails, so one run reports every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          playwright: "true"
          search-tools: "true"
      - name: Unit tests
        run: pnpm run test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          go: "true"
          playwright: "true"
          search-tools: "true"

      - name: Build proxy-helper
        run: make build
        working-directory: tools/proxy-helper

      - name: Test proxy-helper
        run: make test
        working-directory: tools/proxy-helper

      - name: Build binary
        run: pnpm run build:binary

      - name: Script tests
        run: pnpm run test:scripts

      - name: Ensure native node-pty for smoke tests
        run: |
          node --import tsx --input-type=module -e "import pty from 'node-pty'; if (typeof pty.spawn !== 'function') throw new Error('node-pty spawn is unavailable')" ||
            pnpm rebuild node-pty
          node --import tsx --input-type=module -e "import pty from 'node-pty'; if (typeof pty.spawn !== 'function') throw new Error('node-pty spawn is unavailable')"

      - name: Smoke tests
        run: pnpm run test:smoke

  # Tripwire for ACP wire-compat regressions (docs/acp-compat.md). It diffs
  # against the PR base, so it runs on pull requests only. It is advisory: the
  # gate below does not wait for it.
  acp-wire-tripwire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      # Self-test first so a broken checker fails as a checker bug, not as a
      # wire finding.
      - name: ACP wire-compat tripwire
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          pnpm run check:acp-wire:self-test
          pnpm run check:acp-wire -- --base "origin/${{ github.base_ref }}"

  # Document unit tests on macOS and Windows: the documents modules must behave
  # the same on every target. Linux is covered by the unit job. Advisory.
  documents-cross-os:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Document unit tests
        run: pnpm exec vitest run src/extensions/documents

  # The only required check. The "Master" ruleset requires the context
  # "master-checks", so the job keeps that name. Add a job to `needs` to make
  # it block merges; shards and new jobs then never touch branch protection.
  #
  # `if: always()` is required: without it a failed need makes this job
  # "skipped", and GitHub treats a skipped required check as passing.
  # `!cancelled()` is not enough either: a cancelled merge queue run would
  # skip the gate the same way.
  master-checks:
    if: always()
    needs: [lint, unit, build-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
