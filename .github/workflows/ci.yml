name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

jobs:
  documents-cross-os:
    # Document unit tests on macOS + Windows — the documents modules must
    # behave identically across targets; Linux is covered by pr-checks.
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: ci-documents-${{ github.head_ref }}-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Document unit tests
        run: pnpm exec vitest run src/extensions/documents

  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: ci-pr-${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          playwright: "true"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod
          cache-dependency-path: tools/proxy-helper/go.sum

      # The find/grep tools download fd/rg on first use. Provisioning them here keeps the
      # unit suite off the network: a slow download used to blow the test budget and a
      # failed one failed the test with "fd is not available and could not be downloaded".
      - name: Install search tools
        timeout-minutes: 3
        run: |
          # Pinned GitHub-release binaries instead of apt: during the Canonical
          # DNS outage of 2026-11-11 (actions/runner-images#15296) the
          # ubuntu.com mirror fleet was unreachable from runners while
          # github.com stayed healthy. These are the same static musl binaries
          # the runtime downloads on first use. Hashes are pinned so upgrades
          # are deliberate, reviewable diffs.
          curl -fsSL --retry 3 -o /tmp/rg.tgz https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz
          echo "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7  /tmp/rg.tgz" | sha256sum -c -
          tar xzf /tmp/rg.tgz -C /tmp
          sudo install -m 0755 /tmp/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          curl -fsSL --retry 3 -o /tmp/fd.tgz https://github.com/sharkdp/fd/releases/download/v9.0.0/fd-v9.0.0-x86_64-unknown-linux-musl.tar.gz
          echo "069e2d58127ddd944c03a2684ad79f72e3f9bd3e0d2642c36adc5b367c134592  /tmp/fd.tgz" | sha256sum -c -
          tar xzf /tmp/fd.tgz -C /tmp
          sudo install -m 0755 /tmp/fd-v9.0.0-x86_64-unknown-linux-musl/fd /usr/local/bin/fd

      - name: Build proxy-helper
        run: make copy-for-dev # This builds the binary and puts it into a location kimchi can find it
        working-directory: tools/proxy-helper

      - name: Test proxy-helper
        run: make test
        working-directory: tools/proxy-helper

      - name: Check (lint + type check)
        run: pnpm run check

      - name: Build binary
        run: pnpm run build:binary

      - name: Test
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper pnpm run test

      - name: Smoke tests
        run: pnpm run test:smoke

  master-checks:
    # Run on both push-to-master and pull_request so PR CI exercises the same
    # post-merge checks (e.g. `make build` + `pnpm run test` without the
    # `KIMCHI_PROXY_HELPER` env var) that will run after merge. Without this,
    # a PR based on a stale base ref can pass `pr-checks` and only fail at the
    # post-merge `master-checks` step, leaving master red until a follow-up
    # lands (see #657 for the original incident).
    # It also runs on merge_group events as the merge queue's required
    # validation build ("CI / master-checks"): checkout@v4 resolves to the
    # queued merge branch (base + queued PRs), so the queue validates exactly
    # the tree that would land on master before squashing.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      # Pick a concurrency group name based on the triggering event:
      #
      #   push to master     → group = "ci-master"
      #                        (single slot; new pushes cancel stale runs)
      #   pull_request       → group = "ci-pr-master-checks-<head_ref>"
      #                        e.g. PR from "fix/foo"  →  "ci-pr-master-checks-fix/foo"
      #                        (one slot per PR; cancels only that PR's stale runs)
      #   merge_group        → group = "ci-mq-<run_id>"
      #                        (merge-queue validation builds. github.head_ref
      #                        is empty on merge_group events, and each queued
      #                        build needs its own slot — a shared group with
      #                        cancel-in-progress would make successive queue
      #                        builds cancel each other)
      #
      # Why not a single "ci-master" group across both events? It would make
      # concurrent PRs cancel each other and let master pushes cancel
      # in-flight PR runs.
      #
      # `&&`/`||` short-circuit (and `&&` binds tighter than `||`) in GitHub
      # Actions expressions, so each `format(...)` branch is only evaluated
      # for its own event (github.head_ref is only defined on pull_request).
      group: ${{ github.event_name == 'push' && 'ci-master' || github.event_name == 'merge_group' && format('ci-mq-{0}', github.run_id) || format('ci-pr-master-checks-{0}', github.head_ref) }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          playwright: "true"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod
          cache-dependency-path: tools/proxy-helper/go.sum

      # Same reason as pr-checks: keep fd/rg provisioning out of the test runs.
      - name: Install search tools
        timeout-minutes: 3
        run: |
          # See the comment in the pr-checks job: pinned GitHub-release
          # binaries, independent of the ubuntu.com mirror fleet.
          curl -fsSL --retry 3 -o /tmp/rg.tgz https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz
          echo "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7  /tmp/rg.tgz" | sha256sum -c -
          tar xzf /tmp/rg.tgz -C /tmp
          sudo install -m 0755 /tmp/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          curl -fsSL --retry 3 -o /tmp/fd.tgz https://github.com/sharkdp/fd/releases/download/v9.0.0/fd-v9.0.0-x86_64-unknown-linux-musl.tar.gz
          echo "069e2d58127ddd944c03a2684ad79f72e3f9bd3e0d2642c36adc5b367c134592  /tmp/fd.tgz" | sha256sum -c -
          tar xzf /tmp/fd.tgz -C /tmp
          sudo install -m 0755 /tmp/fd-v9.0.0-x86_64-unknown-linux-musl/fd /usr/local/bin/fd

      - name: Build proxy-helper
        run: make build
        working-directory: tools/proxy-helper

      - name: Test proxy-helper
        run: make test
        working-directory: tools/proxy-helper

      - name: Check (lint + type check)
        run: pnpm run check

      - name: Build binary
        run: pnpm run build:binary

      - name: Test
        run: pnpm run test

      - name: Smoke tests
        run: pnpm run test:smoke
