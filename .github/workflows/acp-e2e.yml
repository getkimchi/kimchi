name: ACP E2E

on:
  # PR-time coverage alone misses combinations created when master advances.
  # Validate the queued merged tree and the result that actually lands on master.
  push:
    branches: [master]
  merge_group:
  pull_request:
    # Only root/.github markdown: *.md under src/ and resources/ ships in the binary.
    # TUI test files are ignored, but not tests/e2e/tui/support/ (ACP fixtures import it).
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
      - 'src/**/*.test.ts'
      - 'tests/unit/**'
      - 'tests/smoke/**'
      - 'tests/e2e/tui/*.test.ts'
      - 'tests/e2e/mcp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLURE_ENDPOINT: https://castai.testops.cloud
      ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
      ALLURE_RESULTS: allure-results/acp
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_CONTINUE_ON_ERROR: "true"
      ALLURE_UPLOAD_ENABLED: ${{ contains(fromJSON('["push","merge_group"]'), github.event_name) }}
      ALLURE_RUN_KIND: ${{ github.event_name == 'push' && 'master' || github.event_name == 'merge_group' && 'merge_queue' || 'other' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build proxy-helper
        run: make -C tools/proxy-helper build

      - name: Run ACP E2E tests
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper pnpm run test:e2e:acp

      - name: Install and configure allurectl
        id: allurectl
        if: always() && env.ALLURE_UPLOAD_ENABLED == 'true' && env.ALLURE_TOKEN != '' && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        uses: allure-framework/setup-allurectl@2d89ee0b7ba2f59dbe9849b6df5763cab78e14db # v1.0.3
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}

      - name: Upload Vitest results to Allure TestOps
        if: always() && steps.allurectl.outcome == 'success'
        continue-on-error: true
        run: allurectl upload --launch-name "ACP E2E $ALLURE_RUN_KIND" --launch-tags "commit=$GITHUB_SHA,event=$ALLURE_RUN_KIND,iteration=1" "$ALLURE_RESULTS"

      - name: Upload ACP E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acp-e2e-artifacts
          path: |
            *.acp-e2e.log
            **/acp-traces/**
          if-no-files-found: ignore
