name: ACP E2E

on:
  # PR-time coverage alone misses combinations created when master advances.
  # Validate the queued merged tree and the result that actually lands on master.
  push:
    branches: [master]
  merge_group:
  pull_request:
    # Only root/.github markdown: *.md under src/ and resources/ ships in the binary.
    # TUI test files are ignored, but not tests/e2e/tui/support/ (ACP fixtures import it).
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
      - 'src/**/*.test.ts'
      - 'tests/unit/**'
      - 'tests/smoke/**'
      - 'tests/e2e/tui/*.test.ts'
      - 'tests/e2e/mcp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acp-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          go: "true"
          search-tools: "true"

      - name: Build proxy-helper
        run: make -C tools/proxy-helper build

      - name: Run ACP E2E tests
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper pnpm run test:e2e:acp
        env:
          # CI's lint job already typechecks this tree; test:e2e:acp builds the binary.
          KIMCHI_SKIP_TYPECHECK: "1"

      - name: Upload ACP E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acp-e2e-artifacts
          path: |
            *.acp-e2e.log
            **/acp-traces/**
          if-no-files-found: ignore
