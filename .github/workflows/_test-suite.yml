name: Test suite

# One reusable job shape for every test suite in ci.yml: check out, set up,
# optionally download the shared build, run the suite (split into shards),
# and keep logs when it fails. Each suite splits its own files; this workflow
# only passes SHARD_INDEX and SHARD_TOTAL to the command.

on:
  workflow_call:
    inputs:
      name:
        description: "Suite name, used in job and artifact names"
        type: string
        required: true
      command:
        description: "Shell command that runs the suite. Can use $SHARD_INDEX and $SHARD_TOTAL."
        type: string
        required: true
      shards:
        description: "JSON list of shard indexes, for example [1, 2, 3, 4]"
        type: string
        default: "[1]"
      timeout-minutes:
        type: number
        default: 10
      use-build:
        description: "Download the binary and proxy-helper from the build job"
        type: boolean
        default: false
      search-tools:
        description: "Put ripgrep and fd on PATH"
        type: boolean
        default: false
      playwright:
        description: "Install Playwright Chromium"
        type: boolean
        default: false
      failure-artifacts:
        description: "Paths to upload when the suite fails"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.name }} (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # Run every shard even when one fails, so one run reports every failure.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          search-tools: ${{ inputs.search-tools }}
          playwright: ${{ inputs.playwright }}

      - name: Download build
        if: inputs.use-build
        uses: actions/download-artifact@v4
        with:
          name: kimchi-build
          path: .

      # Artifacts do not keep file modes.
      - name: Restore executable bits
        if: inputs.use-build
        run: chmod +x dist/bin/kimchi bin/proxy-helper

      - name: Run ${{ inputs.name }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: ${{ inputs.command }}

      - name: Upload logs
        if: failure() && inputs.failure-artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-logs-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ inputs.failure-artifacts }}
          if-no-files-found: ignore
          retention-days: 7
