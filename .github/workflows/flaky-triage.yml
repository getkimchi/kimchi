name: flaky-triage

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Lookback window in hours"
        required: false
        default: "48"
      events:
        description: "Comma-separated TestOps launch event tags"
        required: false
        default: "master,merge_queue,nightly"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: flaky-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    name: flaky-triage
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'testops-experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLURE_ENDPOINT: https://castai.testops.cloud
      ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_TOKEN_AVAILABLE: ${{ secrets.ALLURE_TOKEN != '' }}
      FLAKY_WINDOW_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.window_hours || '48' }}
      FLAKY_EVENTS: ${{ github.event_name == 'pull_request' && 'master,merge_queue,nightly,experiment' || github.event_name == 'workflow_dispatch' && inputs.events || 'master,merge_queue,nightly' }}
      FLAKY_OUT_DIR: flaky-report
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Check TestOps configuration
        id: config
        run: |
          if [[ "$ALLURE_TOKEN_AVAILABLE" != "true" || -z "$ALLURE_PROJECT_ID" ]]; then
            echo "testops configuration missing; flaky triage skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe TestOps read API
        if: steps.config.outputs.skip == 'false'
        continue-on-error: true
        run: node scripts/flaky-report.js --probe

      - name: Build flaky test report
        if: steps.config.outputs.skip == 'false'
        run: node scripts/flaky-report.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaky-report
          path: ${{ env.FLAKY_OUT_DIR }}
          if-no-files-found: ignore
          retention-days: 7
