name: TUI E2E

on:
  pull_request:
    # Only root/.github markdown: *.md under src/ and resources/ ships in the binary.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
      - 'src/**/*.test.ts'
      - 'tests/unit/**'
      - 'tests/smoke/**'
      - 'tests/e2e/acp/**'
      - 'tests/e2e/mcp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the binary and proxy-helper once; shards download them below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod
          cache-dependency-path: tools/proxy-helper/go.sum

      # Fresh test homes otherwise download these before the editor accepts input.
      - name: Install search tools
        timeout-minutes: 3
        run: |
          # Pinned GitHub-release binaries instead of apt: during the Canonical
          # DNS outage of 2026-11-11 (actions/runner-images#15296) the
          # ubuntu.com mirror fleet was unreachable from runners while
          # github.com stayed healthy. These are the same static musl binaries
          # the runtime downloads on first use. Hashes are pinned so upgrades
          # are deliberate, reviewable diffs.
          curl -fsSL --retry 3 -o /tmp/rg.tgz https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep-14.1.0-x86_64-unknown-linux-musl.tar.gz
          echo "f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7  /tmp/rg.tgz" | sha256sum -c -
          tar xzf /tmp/rg.tgz -C /tmp
          sudo install -m 0755 /tmp/ripgrep-14.1.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          curl -fsSL --retry 3 -o /tmp/fd.tgz https://github.com/sharkdp/fd/releases/download/v9.0.0/fd-v9.0.0-x86_64-unknown-linux-musl.tar.gz
          echo "069e2d58127ddd944c03a2684ad79f72e3f9bd3e0d2642c36adc5b367c134592  /tmp/fd.tgz" | sha256sum -c -
          tar xzf /tmp/fd.tgz -C /tmp
          sudo install -m 0755 /tmp/fd-v9.0.0-x86_64-unknown-linux-musl/fd /usr/local/bin/fd

      - name: Build proxy-helper
        run: make copy-for-dev # Builds the binary and copies it to bin/ where the tests expect it
        working-directory: tools/proxy-helper

      - name: Build binary
        run: pnpm run build:binary

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-dist
          path: |
            dist/**
            bin/proxy-helper
          retention-days: 1

  tui-e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Run all shards even when one fails, so a single run reports every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Per-shard slice of the roughly 20-minute serial suite, plus headroom
    # for setup and CI variance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: kimchi-dist
          path: .

      - name: Restore executable bits
        run: chmod +x dist/bin/kimchi bin/proxy-helper

      - name: Run TUI E2E tests (shard ${{ matrix.shard }}/4)
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper node scripts/run-tui-e2e.js --shard ${{ matrix.shard }}/4

      - name: Upload TUI E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-e2e-artifacts-${{ matrix.shard }}
          path: |
            *.tui-e2e.log
            **/tui-traces/**
          if-no-files-found: ignore
