name: TUI E2E

on:
  pull_request:
    # Only root/.github markdown: *.md under src/ and resources/ ships in the binary.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
      - 'src/**/*.test.ts'
      - 'tests/unit/**'
      - 'tests/smoke/**'
      - 'tests/e2e/acp/**'
      - 'tests/e2e/mcp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the binary and proxy-helper once; shards download them below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod
          cache-dependency-path: tools/proxy-helper/go.sum

      # Fresh test homes otherwise download these before the editor accepts input.
      - name: Install search tools
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ripgrep fd-find

      - name: Build proxy-helper
        run: make copy-for-dev # Builds the binary and copies it to bin/ where the tests expect it
        working-directory: tools/proxy-helper

      - name: Build binary
        run: pnpm run build:binary

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-dist
          path: |
            dist/**
            bin/proxy-helper
          retention-days: 1

  tui-e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Run all shards even when one fails, so a single run reports every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Per-shard slice of the suite: shards 1/3/4 run ~8 minutes, but the
    # slowest shard (2) has measured 13–16 minutes on the same tree (heavy
    # files: ferment, mcp-*, pii-redaction, work-attribution) — 20 minutes
    # keeps headroom for setup and CI variance without masking a real hang.
    timeout-minutes: 20
    env:
      ALLURE_ENDPOINT: https://castai.testops.cloud
      ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
      ALLURE_RESULTS: allure-results/tui
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_CONTINUE_ON_ERROR: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          bun: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: kimchi-dist
          path: .

      - name: Restore executable bits
        run: chmod +x dist/bin/kimchi bin/proxy-helper

      - name: Run TUI E2E tests (shard ${{ matrix.shard }}/4)
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper node scripts/run-tui-e2e.js --shard ${{ matrix.shard }}/4

      - name: Install and configure allurectl
        id: allurectl
        if: always() && env.ALLURE_TOKEN != '' && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}

      - name: Upload TUI results to Allure TestOps
        if: always() && steps.allurectl.outcome == 'success'
        continue-on-error: true
        run: allurectl upload --launch-name "TUI E2E shard ${{ matrix.shard }}/4" --launch-tags "commit=$GITHUB_SHA" "$ALLURE_RESULTS"

      - name: Upload TUI E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-e2e-artifacts-${{ matrix.shard }}
          path: |
            *.tui-e2e.log
            **/tui-traces/**
          if-no-files-found: ignore
