name: TUI E2E

on:
  pull_request:
    # Only root/.github markdown: *.md under src/ and resources/ ships in the binary.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
      - 'src/**/*.test.ts'
      - 'tests/unit/**'
      - 'tests/smoke/**'
      - 'tests/e2e/acp/**'
      - 'tests/e2e/mcp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the binary and proxy-helper once; shards download them below.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun: "true"
          go: "true"

      - name: Build proxy-helper
        run: make copy-for-dev # Builds the binary and copies it to bin/ where the tests expect it
        working-directory: tools/proxy-helper

      # CI's lint job already typechecks this tree.
      - name: Build binary
        run: pnpm run build:binary
        env:
          KIMCHI_SKIP_TYPECHECK: "1"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kimchi-dist
          path: |
            dist/**
            bin/proxy-helper
          retention-days: 1

  tui-e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Run all shards even when one fails, so a single run reports every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Per-shard slice of the suite: shards 1/3/4 run ~8 minutes, but the
    # slowest shard (2) has measured 13–16 minutes on the same tree (heavy
    # files: ferment, mcp-*, pii-redaction, work-attribution) — 20 minutes
    # keeps headroom for setup and CI variance without masking a real hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The shards run the tests, so they need rg/fd: fresh test homes otherwise
      # download them before the editor accepts input.
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          search-tools: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: kimchi-dist
          path: .

      - name: Restore executable bits
        run: chmod +x dist/bin/kimchi bin/proxy-helper

      - name: Run TUI E2E tests (shard ${{ matrix.shard }}/4)
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper node scripts/run-tui-e2e.js --shard ${{ matrix.shard }}/4

      - name: Upload TUI E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-e2e-artifacts-${{ matrix.shard }}
          path: |
            *.tui-e2e.log
            **/tui-traces/**
          if-no-files-found: ignore
