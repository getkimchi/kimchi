name: TUI E2E

on:
  pull_request:
    # Only root/.github markdown: *.md under src/ and resources/ ships in the binary.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'kimchi.png'
      - 'benchmark/**'
      - 'docker/**'
      - 'test-cases/**'
      - 'src/**/*.test.ts'
      - 'tests/unit/**'
      - 'tests/smoke/**'
      - 'tests/e2e/acp/**'
      - 'tests/e2e/mcp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tui-e2e:
    runs-on: ubuntu-latest
    # Files run serially; setup, build and the suite can take 26 minutes.
    # Leave room for CI runner variance without changing test timeouts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/proxy-helper/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build proxy-helper
        run: make -C tools/proxy-helper build

      - name: Run TUI E2E tests
        run: KIMCHI_PROXY_HELPER=$(pwd)/bin/proxy-helper pnpm run test:e2e:tui

      - name: Upload TUI E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-e2e-artifacts
          path: |
            *.tui-e2e.log
            **/tui-traces/**
          if-no-files-found: ignore
