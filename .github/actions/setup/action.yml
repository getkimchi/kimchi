name: Setup
description: Enable corepack, set up Node.js 22, install dependencies, and optionally install Bun, Go, ripgrep/fd and Playwright

inputs:
  bun:
    description: "Install Bun runtime"
    required: false
    default: "false"
  go:
    description: "Install Go for tools/proxy-helper"
    required: false
    default: "false"
  search-tools:
    description: "Put pinned ripgrep and fd binaries on PATH (Linux only)"
    required: false
    default: "false"
  playwright:
    description: "Install Playwright Chromium browser"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The find/grep tools download fd/rg on first use. Having them on PATH keeps
    # tests off the network: a slow download used to blow the test budget, and a
    # failed one failed the test. Release binaries in a cache replace apt-get,
    # which took 21 s on a median run and up to 93 s on a slow mirror.
    - name: Cache search tools
      if: inputs.search-tools == 'true'
      id: search-tools-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/kimchi-ci/search-tools
        key: search-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/install-search-tools.sh') }}

    - name: Install search tools
      if: inputs.search-tools == 'true' && steps.search-tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-search-tools.sh" "$HOME/.cache/kimchi-ci/search-tools"

    - name: Add search tools to PATH
      if: inputs.search-tools == 'true'
      shell: bash
      run: |
        echo "$HOME/.cache/kimchi-ci/search-tools" >> "$GITHUB_PATH"
        "$HOME/.cache/kimchi-ci/search-tools/rg" --version | head -1
        "$HOME/.cache/kimchi-ci/search-tools/fd" --version

    - name: Setup Go
      if: inputs.go == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: tools/proxy-helper/go.mod
        cache-dependency-path: tools/proxy-helper/go.sum

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22.19.0"
        cache: "pnpm"

    # postinstall bundles skill helpers with Bun, so install it before pnpm.
    - name: Setup Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.4.4"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    - name: Verify native smoke-test module
      shell: bash
      run: |
        pnpm rebuild node-pty --reporter=append-only
        node -e "require('node-pty')"

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright Chromium
      if: inputs.playwright == 'true'
      shell: bash
      # --with-deps runs `sudo apt-get update && apt-get install` on every run,
      # which is slow on GitHub's ubuntu-latest runners (they already ship
      # the core Chromium system deps) and intermittently hangs on apt mirror
      # stalls, causing merge-queue ejections when the step exceeds the
      # job's timeout-minutes.  Dropping it saves ~20s on cache hits and
      # eliminates the hang risk.
      run: npx playwright install chromium
