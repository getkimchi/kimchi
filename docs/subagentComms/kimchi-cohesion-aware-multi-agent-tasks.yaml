schema_version: 1
project: Kimchi Cohesion-Aware Multi-Agent Execution
repository: getkimchi/kimchi
repository_snapshot: 4cb2f4460db990f1db53bda1cf8c5f0352541f14
design_document: kimchi-cohesion-aware-multi-agent-implementation-plan.md
updated_at: '2026-08-16'
status_values:
- planned
- in_progress
- blocked
- in_review
- done
- cancelled
claim_protocol:
- Read AGENTS.md and the implementation plan.
- Claim only a task whose dependencies are done.
- Set status, owner_agent, and started_at before editing.
- Keep the task scope; create follow-up tasks for discovered work.
- Record verification commands, evidence, and commits.
- Set done only after every acceptance criterion passes.
architecture_decisions:
- id: AD-001
  decision: Extend Ferment; do not create a second project lifecycle.
- id: AD-002
  decision: Task group is the unit of persistent agent ownership.
- id: AD-003
  decision: Use event-driven dependency scheduling, not global waves.
- id: AD-004
  decision: Publish stable boundaries before fan-out.
- id: AD-005
  decision: Use Action-State-Result handoffs.
- id: AD-006
  decision: Represent source changes as operations, not agent branches.
- id: AD-007
  decision: Separate complementary and competitive execution.
- id: AD-008
  decision: Ferment event log is initially authoritative; SQLite is a projection.
- id: AD-009
  decision: Read invalidation is fallback, not the normal path.
- id: AD-010
  decision: Roll out in shadow mode with measurable thresholds.
milestones:
- id: M0
  title: Baseline and shadow instrumentation
  exit_gate: Metrics and shadow plans are deterministic; disabled behavior is unchanged.
- id: M1
  title: Task groups, dependencies, scheduler, and handoffs
  exit_gate: Persistent groups run dependency-ready work and replay correctly.
- id: M2
  title: Source snapshots, operations, and conflicts
  exit_gate: CAS application and durable conflicts work without agent branch identity.
- id: M3
  title: Cohesion analysis
  exit_gate: Deterministic grouping recommendations improve or preserve the cost-quality frontier.
- id: M4
  title: Execution scopes and competitive mode
  exit_gate: Alternative attempts are staged, verifiable, and discardable.
- id: M5
  title: Sparse supervision and rollout
  exit_gate: Bounded interventions and internal canary meet rollout thresholds.
